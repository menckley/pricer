name: Pricings archivés

# Vérifie hors ligne le schéma des pricings archivés et leur cohérence avec journal.csv.
# ci.yml ignore pricings/** au push : ce workflow couvre ces modifications.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pricings/**"
      - "tests/test_pricings_archives.py"
  push:
    branches: [main]
    paths:
      - "pricings/**"
      - "tests/test_pricings_archives.py"

permissions:
  contents: read

concurrency:
  group: pricings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pricings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer le paquet
        run: pip install -e ".[dev]"
      - name: pytest (pricings archivés)
        run: pytest tests/test_pricings_archives.py
