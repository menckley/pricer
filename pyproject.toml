[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer"
version = "0.3.0"
description = "Pricer de produits structurés électricité France, sur la HPFC et les settlements de power-hpfc"
requires-python = ">=3.11"
# power-hpfc doit être installé séparément depuis son clone local (pip install -e power-hpfc)
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
