[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pricer"
version = "0.10.0"
description = "Pricer de produits structurés électricité France, sur la HPFC et les settlements de power-hpfc"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
authors = [{name = "Clément Corve"}]
# power-hpfc (module « hpfc ») n'est volontairement pas déclaré ici : son archive de données est un clone privé piloté
# par git (voir market.py). À installer séparément depuis son clone local (pip install -e power-hpfc) ; voir le README.
# Bornes hautes = prochaine version majeure : les résultats de pricing dépendent de numpy/pandas.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=3.1.1,<4",
    "pyarrow>=15,<27",
    "requests>=2.34.2,<3",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1.9"]
dev = ["pytest>=9.2.0", "ruff>=0.17.6", "pip-audit>=2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E731"]   # zip() sans strict= : comportement inchangé ; lambdas nommées dans les tests

[tool.bandit]
exclude_dirs = ["tests"]   # assert pytest et SHA1 de blob Git dans les tests : faux positifs
